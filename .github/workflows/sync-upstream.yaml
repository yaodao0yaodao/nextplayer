name: Sync upstream and build ARM64

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

env:
  NEXTPLAYER_ABIS: arm64-v8a

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/anilbeesetti/nextplayer.git
          git fetch upstream main --tags
          git merge --no-edit upstream/main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-cleanup: always

      - name: Configure optional private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nextplayer-release.keystore"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/nextplayer-release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Test and build ARM64 release APK
        run: ./gradlew test ktlintCheck :app:assembleRelease

      - name: Name APK
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "nextplayer-personal-v${version}-arm64-v8a.apk"

      - name: Upload daily ARM64 build
        uses: actions/upload-artifact@v7
        with:
          name: nextplayer-personal-v${{ env.APP_VERSION }}-arm64-v8a
          path: nextplayer-personal-v${{ env.APP_VERSION }}-arm64-v8a.apk

      - name: Detect an upstream formal release
        id: formal_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream_tag=$(gh api repos/anilbeesetti/nextplayer/releases/latest --jq .tag_name)
          if [ "$upstream_tag" = "v${APP_VERSION}" ] && ! gh release view "$upstream_tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish formal version to Releases
        if: steps.formal_release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.formal_release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            "nextplayer-personal-v${APP_VERSION}-arm64-v8a.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "$RELEASE_TAG" \
            --generate-notes
